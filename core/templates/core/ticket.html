

<body class="flex min-h-screen items-center justify-center bg-gray-950 px-4">


        <p class="mt-3 text-center text-sm font-medium text-green-400">
            Reservation Confirmed
        </p>

        <!-- Movie name -->
        <h1 class="mt-4 text-center text-lg font-semibold text-white">
            {{ movie_name }}
        </h1>

        <div class="my-5 border-t border-dashed border-gray-700"></div>

        <!-- Show time -->
        <div class="flex items-center justify-between">
            <span class="text-sm text-gray-500 ">
                Show time
            </span>

            <span class="text-sm font-medium text-white">
                {{ show_time|date:"M d, Y - h:i A" }}
            </span>
        </div>

        <!-- Seats -->
        <div class="mt-4">
            <p class="text-sm text-gray-400">
                Seats
            </p>

            <div class="mt-2 flex flex-wrap gap-2">
                {% for seat in seats %}
                    <span class="rounded-md bg-green-500/15 px-2.5 py-1 text-xs font-medium text-green-300">
                        {{ seat }}
                    </span>
                {% empty %}
                    <span class="text-xs text-gray-500">
                        No seats selected
                    </span>
                {% endfor %}
            </div>
        </div>

    </div>

</body>
