
{% extends "core/base.html" %}

{% block main_content %}

<div class="max-w-5xl mx-auto">

    <!-- Page Heading -->
    <div class="text-center mb-10">
        <h2 class="text-3xl md:text-4xl font-bold text-white">
            Select Your Seats
        </h2>

        <p class="text-gray-400 mt-2">
            Choose your preferred seats for the movie
        </p>
    </div>


    <!-- Cinema Screen -->
    <div class="flex flex-col items-center mb-12">

        <svg
            viewBox="0 0 800 150"
            class="w-full max-w-3xl h-auto"
            xmlns="http://www.w3.org/2000/svg"
        >

            <!-- Screen -->
            <path
                d="M100 110 Q400 20 700 110"
                fill="none"
                stroke="#ef4444"
                stroke-width="8"
                stroke-linecap="round"
            />

            <!-- Screen Glow -->
            <path
                d="M120 108 Q400 35 680 108"
                fill="none"
                stroke="#ef4444"
                stroke-width="20"
                stroke-linecap="round"
                opacity="0.12"
            />

            <!-- Screen Text -->
            <text
                x="400"
                y="90"
                text-anchor="middle"
                fill="#9ca3af"
                font-size="22"
                font-family="Arial, sans-serif"
                letter-spacing="4"
            >
                SCREEN
            </text>

        </svg>

        <p class="text-gray-500 text-sm mt-2">
            All eyes this way
        </p>

    </div>


    <!-- Seats Container -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 md:p-10 shadow-xl">

        <!-- Seat Area -->
        <div class="flex flex-col items-center gap-4">

            {% for seat in seats %}

                <!-- Individual Seat -->
                <div class="group">

                    <button
                        type="button"
                        class="
                            w-12 h-12
                            sm:w-14 sm:h-14
                            rounded-lg
                            bg-gray-800
                            border border-gray-700
                            text-gray-300
                            font-semibold
                            text-sm
                            shadow-md
                            hover:bg-red-600
                            hover:border-red-500
                            hover:text-white
                            hover:scale-105
                            transition
                            duration-200
                        "
                    >
                        {{ seat.name }}
                    </button>

                </div>

            {% empty %}

                <div class="text-center py-12">
                    <p class="text-gray-400 text-lg">
                        No seats available.
                    </p>
                </div>

            {% endfor %}

        </div>

    </div>


    <!-- Seat Legend -->
    <div class="flex justify-center items-center gap-8 mt-8">

        <!-- Available -->
        <div class="flex items-center gap-2">
            <div
                class="w-5 h-5 rounded-md bg-gray-800 border border-gray-700"
            ></div>

            <span class="text-sm text-gray-400">
                Available
            </span>
        </div>


        <!-- Selected -->
        <div class="flex items-center gap-2">
            <div
                class="w-5 h-5 rounded-md bg-red-600 border border-red-500"
            ></div>

            <span class="text-sm text-gray-400">
                Selected
            </span>
        </div>


        <!-- Booked -->
        <div class="flex items-center gap-2">
            <div
                class="w-5 h-5 rounded-md bg-gray-950 border border-gray-800"
            ></div>

            <span class="text-sm text-gray-400">
                Booked
            </span>
        </div>

    </div>


    <!-- Continue Button -->
    <div class="flex justify-center mt-10">

        <button
            type="button"
            class="
                px-8 py-3
                bg-red-600
                hover:bg-red-700
                text-white
                font-semibold
                rounded-lg
                shadow-lg
                transition
                duration-200
            "
        >
            Continue
        </button>

    </div>

</div>

{% endblock main_content %}
