
{% extends "core/base.html" %}

{% block main_content %}

<div class="min-h-[70vh] flex items-center justify-center">

    <div class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl shadow-xl p-8">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-white">
                Welcome Back
            </h2>

            <p class="text-gray-400 mt-2">
                Login to your CinemaReserve account
            </p>
        </div>

        <!-- Login Form -->
        <form method="POST" class="space-y-5">

            {% csrf_token %}

            <!-- Username -->
            <div>
                <label
                    for="username"
                    class="block text-sm font-medium text-gray-300 mb-2"
                >
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg
                           px-4 py-3 text-white placeholder-gray-500
                           focus:outline-none focus:ring-2 focus:ring-red-500
                           focus:border-red-500 transition"
                >
            </div>

            <!-- Password -->
            <div>
                <label
                    for="password"
                    class="block text-sm font-medium text-gray-300 mb-2"
                >
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg
                           px-4 py-3 text-white placeholder-gray-500
                           focus:outline-none focus:ring-2 focus:ring-red-500
                           focus:border-red-500 transition"
                >
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-red-600 hover:bg-red-700
                       text-white font-semibold
                       py-3 rounded-lg
                       transition duration-200"
            >
                Login
            </button>

        </form>

        <!-- Register Link -->
        <div class="text-center mt-6">
            <p class="text-gray-400 text-sm">
                Don't have an account?
                <a
                    href="{% url 'register' %}"
                    class="text-red-500 hover:text-red-400
                           font-medium transition"
                >
                    Register
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock main_content %}
